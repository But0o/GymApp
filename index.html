<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#12151b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Gym</title>
</head>
<body>
<header id="top">
  <h1 id="title">Entrenar</h1>
  <span id="clock"></span>
</header>

<main id="view"></main>

<div id="rest" hidden>
  <button data-act="rest-add" data-v="-15">−15</button>
  <div class="rest-mid"><small>Descanso</small><b id="rest-time">0:00</b></div>
  <button data-act="rest-add" data-v="15">+15</button>
  <button data-act="rest-skip" class="ghost">Saltar</button>
</div>

<nav id="tabs">
  <button data-tab="entrenar"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Entrenar</button>
  <button data-tab="rutinas"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Rutinas</button>
  <button data-tab="historial"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Ajustes</button>
</nav>

<datalist id="ejercicios"></datalist>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
